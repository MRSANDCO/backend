spring.application.name=backend
spring.data.mongodb.uri=${MONGO_URL:${MONGO_URI:mongodb://localhost:27017/ca_firm_db}}


# Auth is embedded in the URI string — do NOT set these separately
# spring.data.mongodb.username=
# spring.data.mongodb.password=
# spring.data.mongodb.authentication-database=

# CORS Configuration
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# Admin credentials — MUST be set via environment variables. No defaults.
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}

# File Upload Limits (for PDF uploads)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.port=8083

# JWT — MUST be set via environment variables. No defaults.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── Email (Resend) ──────────────────────────────────────────────────────────
app.resend.api-key=${RESEND_API_KEY:}
app.resend.from-email=${RESEND_FROM_EMAIL:queries@mrsandco.in}
app.resend.from-name=MRS & Co. Chartered Accountants
app.admin.email=${ADMIN_EMAIL:camrsandco@gmail.com}

# Frontend base URL — used in email links so clients can navigate to the dashboard
app.frontend.url=${APP_FRONTEND_URL:http://localhost:3000}

# Backend base URL — used to generate direct download links in notification emails
app.backend.url=${APP_BACKEND_URL:http://localhost:8083}

# ── WhatsApp (Meta Cloud API) ────────────────────────────────────────────────
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:${PHONE_NUMBER_ID:}}
whatsapp.api-version=${WHATSAPP_API_VERSION:v25.0}
whatsapp.base-url=${BASE_URL:https://graph.facebook.com}
whatsapp.template-name=${WHATSAPP_TEMPLATE_NAME:query_raised_notification}
whatsapp.template-language=${WHATSAPP_TEMPLATE_LANGUAGE:en}

# ── Company Formation Anniversary Automation ────────────────────────────────
whatsapp.anniversary.template-name=${WHATSAPP_ANNIVERSARY_TEMPLATE_NAME:company_anniversary_greeting}
whatsapp.anniversary.template-language=${WHATSAPP_ANNIVERSARY_TEMPLATE_LANGUAGE:en}
whatsapp.anniversary.contact-fallback-policy=${WHATSAPP_ANNIVERSARY_CONTACT_FALLBACK_POLICY:USE_FALLBACK_VALUE}
whatsapp.anniversary.fallback-contact-name=${WHATSAPP_ANNIVERSARY_FALLBACK_CONTACT_NAME:Valued Client}
whatsapp.anniversary.fallback-company-name=${WHATSAPP_ANNIVERSARY_FALLBACK_COMPANY_NAME:Valued Enterprise}
whatsapp.anniversary.scheduler.enabled=${WHATSAPP_ANNIVERSARY_SCHEDULER_ENABLED:false}
whatsapp.anniversary.scheduler.cron=${WHATSAPP_ANNIVERSARY_SCHEDULER_CRON:0 0 9 * * *}
whatsapp.anniversary.scheduler.timezone=${WHATSAPP_ANNIVERSARY_SCHEDULER_TIMEZONE:Asia/Kolkata}
whatsapp.anniversary.scheduler.catch-up-hours=${WHATSAPP_ANNIVERSARY_CATCH_UP_HOURS:24}
whatsapp.anniversary.leap-day-policy=${WHATSAPP_ANNIVERSARY_LEAP_DAY_POLICY:FEB_28}
whatsapp.anniversary.retry.max-attempts=${WHATSAPP_ANNIVERSARY_RETRY_MAX_ATTEMPTS:3}
whatsapp.anniversary.retry.initial-interval-minutes=${WHATSAPP_ANNIVERSARY_RETRY_INTERVAL_MINUTES:5}
whatsapp.anniversary.retry.multiplier=${WHATSAPP_ANNIVERSARY_RETRY_MULTIPLIER:2.0}
whatsapp.anniversary.sender-name=${WHATSAPP_ANNIVERSARY_SENDER_NAME:MRS & Co.}
whatsapp.webhook.verify-token=${WHATSAPP_WEBHOOK_VERIFY_TOKEN:mrsco_verify_2026}
whatsapp.webhook.app-secret=${WHATSAPP_WEBHOOK_APP_SECRET:}


# ── Founder Birthday Greeting Automation ────────────────────────────────────────
# Template: founder_birthday_greeting | Language: en | Variable: {{1}} = founder full name
# IMPORTANT: The template must be approved in Meta WhatsApp Manager before enabling.
whatsapp.birthday.template-name=${WHATSAPP_BIRTHDAY_TEMPLATE_NAME:founder_birthday_greeting}
whatsapp.birthday.template-language=${WHATSAPP_BIRTHDAY_TEMPLATE_LANGUAGE:en}
# Disabled by default. Set WHATSAPP_BIRTHDAY_SCHEDULER_ENABLED=true to activate in production.
whatsapp.birthday.scheduler.enabled=${WHATSAPP_BIRTHDAY_SCHEDULER_ENABLED:false}
whatsapp.birthday.scheduler.cron=${WHATSAPP_BIRTHDAY_SCHEDULER_CRON:0 0 9 * * *}
whatsapp.birthday.scheduler.timezone=${WHATSAPP_BIRTHDAY_SCHEDULER_TIMEZONE:Asia/Kolkata}
whatsapp.birthday.leap-day-policy=${WHATSAPP_BIRTHDAY_LEAP_DAY_POLICY:FEB_28}
whatsapp.birthday.retry.max-attempts=${WHATSAPP_BIRTHDAY_RETRY_MAX_ATTEMPTS:3}
whatsapp.birthday.retry.initial-interval-minutes=${WHATSAPP_BIRTHDAY_RETRY_INTERVAL_MINUTES:5}
whatsapp.birthday.retry.multiplier=${WHATSAPP_BIRTHDAY_RETRY_MULTIPLIER:2.0}
whatsapp.birthday.retry.check-interval-ms=${WHATSAPP_BIRTHDAY_RETRY_CHECK_INTERVAL_MS:600000}


# # logging.level.org.springframework.security=TRACE
# logging.level.org.springframework.web=TRACE
