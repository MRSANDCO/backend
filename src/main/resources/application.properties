spring.application.name=backend
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/ca_firm_db}


# Auth is embedded in the URI string — do NOT set these separately
# spring.data.mongodb.username=
# spring.data.mongodb.password=
# spring.data.mongodb.authentication-database=

# CORS Configuration
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# Admin credentials — MUST be set via environment variables. No defaults.
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}

# File Upload Limits (for PDF uploads)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.port=8083

# JWT — MUST be set via environment variables. No defaults.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── Email (Resend) ──────────────────────────────────────────────────────────
app.resend.api-key=${RESEND_API_KEY:}
app.resend.from-email=${RESEND_FROM_EMAIL:queries@mrsandco.in}
app.resend.from-name=MRS & Co. Chartered Accountants

# Frontend base URL — used in email links so clients can navigate to the dashboard
app.frontend.url=${APP_FRONTEND_URL:http://localhost:3000}

# Backend base URL — used to generate direct download links in notification emails
app.backend.url=${APP_BACKEND_URL:http://localhost:8083}

# ── WhatsApp (Meta Cloud API) ────────────────────────────────────────────────
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:${PHONE_NUMBER_ID}}
whatsapp.api-version=${WHATSAPP_API_VERSION:v25.0}
whatsapp.base-url=${BASE_URL:https://graph.facebook.com}

# # logging.level.org.springframework.security=TRACE
# logging.level.org.springframework.web=TRACE
