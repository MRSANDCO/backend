# Unified Test properties
spring.application.name=backend-test

# Embedded MongoDB (via flapdoodle)
spring.data.mongodb.database=ca_firm_test_db
de.flapdoodle.mongodb.embedded.version=7.0.0

# Admin credentials for tests
app.admin.username=admin
app.admin.password=admin123

# Mock JWT secrets for JwtUtil creation in tests
app.jwt.secret=mockSecretKeyThatIsAtLeast32BytesLongForHS256Algorithm
app.jwt.expiration-ms=86400000

# Use random port for web server
server.port=0

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# WhatsApp Meta Cloud API (test placeholders — not actually called in unit tests)
whatsapp.access-token=test_access_token
whatsapp.phone-number-id=test_phone_number_id
whatsapp.api-version=v23.0
whatsapp.base-url=https://graph.facebook.com
whatsapp.template-name=query_raised_notification
whatsapp.template-language=en

# Email — not tested by default; JavaMailSender is optional in tests
app.resend.api-key=test_key
app.resend.from-email=test@example.com
app.frontend.url=http://localhost:3000
