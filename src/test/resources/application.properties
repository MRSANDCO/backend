# Unified Test properties
spring.application.name=backend-test

# Embedded MongoDB (via flapdoodle)
spring.data.mongodb.database=ca_firm_test_db
de.flapdoodle.mongodb.embedded.version=7.0.0

# Admin credentials for tests
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}



# Mock JWT secrets for JwtUtil creation in tests
app.jwt.secret=mockSecretKeyThatIsAtLeast32BytesLongForHS256Algorithm
app.jwt.expiration-ms=86400000

# Use random port for web server
server.port=8083
# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# WhatsApp Meta Cloud API (test placeholders — not actually called in unit tests)
whatsapp.access-token=test_access_token
whatsapp.phone-number-id=test_phone_number_id
whatsapp.api-version=v23.0
whatsapp.base-url=https://graph.facebook.com
whatsapp.template-name=query_raised_notification
whatsapp.template-language=en

# Email — not tested by default; JavaMailSender is optional in tests
app.resend.api-key=test_key
app.resend.from-email=test@example.com
app.frontend.url=http://localhost:3000

# WhatsApp Anniversary (Test)
whatsapp.anniversary.template-name=company_anniversary_greeting
whatsapp.anniversary.template-language=en
whatsapp.anniversary.contact-fallback-policy=USE_FALLBACK_VALUE
whatsapp.anniversary.fallback-contact-name=Valued Client
whatsapp.anniversary.fallback-company-name=Valued Enterprise
whatsapp.anniversary.scheduler.enabled=false
whatsapp.anniversary.scheduler.cron=0 0 9 * * *
whatsapp.anniversary.scheduler.timezone=Asia/Kolkata
whatsapp.anniversary.scheduler.catch-up-hours=24
whatsapp.anniversary.leap-day-policy=FEB_28
whatsapp.anniversary.retry.max-attempts=3
whatsapp.anniversary.retry.initial-interval-minutes=5
whatsapp.anniversary.retry.multiplier=2.0
whatsapp.anniversary.sender-name=MRS & Co.
whatsapp.webhook.verify-token=mrsco_verify_2026
